membership_policy:
  evaluation_frequency: daily
  evaluation_time: null

  rolling_window:
    type: rolling_months
    months: 12

  valid_spend:
    amount_source: item_paid_amount
    exclude_unpaid_orders: true
    exclude_cancelled_orders: true
    subtract_successful_refunds: true
    refund_attribution: original_paid_date

  tiers: []

commerce_policy:
  gmv:
    amount_source: item_paid_amount
    date_attribution: paid_at
    include_unpaid_orders: false
    include_cancelled_orders: false
    subtract_refunds: false

  so:
    amount_source: item_paid_amount
    subtract_successful_refunds: true
    refund_attribution: original_paid_date

  refund:
    request_window_days_after_delivery: 14
    allow_partial_refund: true
    allow_multiple_refunds_per_item: true
    max_cumulative_refund_ratio: 1.0

  fulfillment:
    split_shipment_supported: false
    multiple_packages_supported: false

customer_semantics:
  brand_new_customer:
    metric_name: brand_paid_new_customer
    definition: first_successful_payment
    reverse_on_full_refund: false

  channel_new_customer:
    definition: first_successful_payment_in_channel

  channel_contributed_brand_new_customer:
    definition: brand_first_successful_payment_in_channel

  future_metrics:
    - brand_effective_new_customer

  ambiguous_new_customer_query:
    behavior: clarification

activity_segmentation:
  customer_grain: customer_x_activity_period
  mutually_exclusive: true

  membership_states:
    - old_member
    - new_member
    - non_member

  customer_states:
    - old_customer
    - new_customer

  segments:
    - new_member_new_customer
    - new_member_old_customer
    - old_member_new_customer
    - old_member_old_customer
    - non_member_new_customer
    - non_member_old_customer

  final_customer_basis: effective_purchase
  require_refund_observation_window: true

business_patterns:
  P01_customer_purchase_long_tail:
    enabled: true
    parameters: {}
    acceptance_gate: distribution_customer_long_tail

  P02_membership_r12_transition:
    enabled: true
    parameters: {}
    acceptance_gate: membership_transition_validity

  P03_membership_customer_overlap:
    enabled: true

    parameters:
      mapped_customer_ratio: 0.60

      membership_status_distribution:
        active: 0.92
        inactive: 0.08

      channel_binding_count_distribution:
        1: 0.60
        2: 0.28
        3: 0.09
        4: 0.025
        5: 0.005

      require_join_channel_binding: true
      inactive_account_open_binding_allowed: false

    acceptance_gate: identity_overlap_coverage

  P04_new_customer_scope_difference:
    enabled: true
    parameters: {}
    acceptance_gate: new_customer_scope_difference

  P05_product_sales_long_tail:
    enabled: true
    parameters: {}
    acceptance_gate: distribution_product_long_tail

  P06_season_region_demand:
    enabled: true
    parameters: {}
    acceptance_gate: season_region_signal

  P07_marketing_diminishing_returns:
    enabled: true
    parameters: {}
    acceptance_gate: marketing_marginal_return

  P08_promotion_margin_tradeoff:
    enabled: true
    parameters: {}
    acceptance_gate: promotion_margin_tradeoff

  P09_refund_review_quality:
    enabled: true
    parameters: {}
    acceptance_gate: refund_review_statistical_relation

deferred_capabilities:
  P1:
    - coupon_issuance_and_redemption
    - basic_inventory
    - controlled_data_quality_cases

  P2:
    - points_ledger
    - points_redemption
    - reservation_and_final_payment
    - offline_store_return
    - complete_birthday_benefits
    - complete_identity_resolution

data_quality:
  mode: clean_baseline

  reject_invalid_foreign_keys: true
  reject_negative_amounts: true
  reject_overlapping_effective_periods: true
  reject_invalid_event_time_order: true
  reject_refund_overpayment: true

  controlled_anomalies:
    enabled: false

compatibility:
  preserve_v1: true
  modify_v1_schema: false
  modify_v1_seed: false
  require_v1_regression_pass: true

  graph_integration:
    enabled: false

acceptance_gates:
  v1_isolation:
    enabled: true
    validator: null

  reproducibility:
    enabled: true
    validator: null

  schema_integrity:
    enabled: true
    validator: null

  event_time_integrity:
    enabled: true
    validator: null

  amount_integrity:
    enabled: true
    validator: null

  membership_policy:
    enabled: true
    validator: null

  identity_and_segmentation:
    enabled: true
    validator: null

  new_customer_semantics:
    enabled: true
    validator: null

  distribution_checks:
    enabled: true
    validator: null

