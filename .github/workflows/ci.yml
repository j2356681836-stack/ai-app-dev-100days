name: Deterministic CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unified-regression:
    name: Unified Regression
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      LANGFUSE_OBSERVABILITY_ENABLED: "false"
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10.20
        uses: actions/setup-python@v7
        with:
          python-version: "3.10.20"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Verify dependency health
        run: python -m pip check

      - name: Run deterministic unified regression
        run: python -m app.evaluation.unified_regression_v2
