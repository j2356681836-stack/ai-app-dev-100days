- name: channel_paid_new_customer_count_channel_v2
  metric: channel_paid_new_customer_count
  chinese_name: 渠道支付新客数
  query_type: global_history_first_event_metric
  result_grain: channel
  description: 按渠道统计 customer 在该 channel 的第一次成功支付事件。同一 customer 可以分别成为多个渠道的新客，但在同一 channel 中最多一次。
  semantic_contract:
    date_attribution: fact_orders.paid_at
    metric_expression: COUNT(customer-channel whose first_channel_paid_at falls within the analysis window)
    base_filters:
    - fact_orders.paid_at IS NOT NULL
    - channel first successful payment is determined before the analysis date filter
    time_window_columns:
    - fact_orders.paid_at
  query_logic:
    stages:
    - stage_id: channel_first_paid_history
      stage_type: aggregate
      source:
        table: fact_orders
        stage_id: null
        alias: fo
      joins: []
      filters:
      - fo.paid_at IS NOT NULL
      group_by:
      - fo.customer_id
      - fo.channel_id
      having: []
      outputs:
      - field: customer_id
        expression: fo.customer_id
      - field: channel_id
        expression: fo.channel_id
      - field: first_channel_paid_at
        expression: MIN(fo.paid_at)
      hidden_control_fields: []
    - stage_id: windowed_channel_acquisition
      stage_type: aggregate
      source:
        table: null
        stage_id: channel_first_paid_history
        alias: cfp
      joins: []
      filters:
      - CAST(cfp.first_channel_paid_at AS DATE) BETWEEN :analysis_start_date AND :analysis_end_date
      group_by:
      - cfp.channel_id
      having: []
      outputs:
      - field: channel_id
        expression: cfp.channel_id
      - field: channel_paid_new_customer_count
        expression: COUNT(DISTINCT cfp.customer_id)
      hidden_control_fields: []
    - stage_id: final
      stage_type: project
      source:
        table: null
        stage_id: windowed_channel_acquisition
        alias: wca
      joins:
      - table: dim_channel
        alias: dc
        join_type: inner
        conditions:
        - left: wca.channel_id
          right: dc.channel_id
      filters: []
      group_by: []
      having: []
      outputs:
      - field: channel_name
        expression: dc.channel_name
      - field: channel_paid_new_customer_count
        expression: wca.channel_paid_new_customer_count
      hidden_control_fields:
      - field: __group_size
        expression: wca.channel_paid_new_customer_count
        semantics: channel_paid_new_customers_per_channel
    final_stage: final
  resource_contract:
    required_tables:
    - dim_channel
    - dim_region
    - fact_orders
    required_columns:
    - dim_channel.channel_code
    - dim_channel.channel_id
    - dim_channel.channel_name
    - dim_region.region_code
    - dim_region.region_id
    - fact_orders.channel_id
    - fact_orders.customer_id
    - fact_orders.order_id
    - fact_orders.paid_at
    - fact_orders.shipping_region_id
  scope_contract:
    scope_mode: global_history_required
    source_tables:
    - fact_orders
    required_dimensions:
    - channel
    - region
    targets:
    - target_id: channel_first_paid_orders
      source_table: fact_orders
      table_aliases:
      - table_name: fact_orders
        alias: fo
    history_contract:
      history_stage_id: channel_first_paid_history
      analysis_window_stage_id: windowed_channel_acquisition
      history_source_tables:
      - fact_orders
      sequence_partition_by:
      - fo.customer_id
      - fo.channel_id
      sequence_order_by:
      - fo.paid_at
      - fo.order_id
      pre_sequence_scope_bindings:
      - dimension: channel
        partition_reference: fo.channel_id
      post_sequence_scope_dimensions:
      - region
      analysis_window_parameters:
      - analysis_start_date
      - analysis_end_date
  result_contract:
    field_bindings:
    - output_field: channel_name
      source_columns:
      - dim_channel.channel_name
      category: ordinary
      token_namespace: null
    - output_field: channel_paid_new_customer_count
      source_columns:
      - fact_orders.channel_id
      - fact_orders.customer_id
      - fact_orders.paid_at
      category: ordinary
      token_namespace: null
    result_shape: aggregate
    minimum_group_size_required: true
    group_size_field: __group_size
    policy_version: result_protection_v1
  default_sort:
    field: channel_paid_new_customer_count
    direction: desc
- name: gmv_channel_region_v2
  metric: gmv
  chinese_name: 渠道×地区GMV
  query_type: aggregate_metric
  result_grain: channel_region
  description: 按渠道与地区复合 Grain 计算 GMV。
  semantic_contract:
    date_attribution: fact_orders.paid_at
    metric_expression: SUM(foi.item_paid_amount)
    base_filters:
    - fact_orders.paid_at IS NOT NULL
    time_window_columns: []
  query_logic:
    base_source:
      table: fact_order_items
      alias: foi
    joins:
    - table: fact_orders
      alias: fo
      join_type: inner
      conditions:
      - left: foi.order_id
        right: fo.order_id
    - table: dim_channel
      alias: dc
      join_type: inner
      conditions:
      - left: fo.channel_id
        right: dc.channel_id
    - table: dim_region
      alias: dr
      join_type: inner
      conditions:
      - left: fo.shipping_region_id
        right: dr.region_id
    group_by:
    - dc.channel_id
    - dc.channel_name
    - dr.region_id
    - dr.region_name
    outputs:
    - field: channel_name
      expression: dc.channel_name
    - field: region_name
      expression: dr.region_name
    - field: gmv
      expression: SUM(foi.item_paid_amount)
    hidden_control_fields:
    - field: __group_size
      expression: COUNT(DISTINCT fo.customer_id)
      semantics: distinct_buyers_per_result_group
  resource_contract:
    required_tables:
    - dim_channel
    - dim_region
    - fact_order_items
    - fact_orders
    required_columns:
    - dim_channel.channel_code
    - dim_channel.channel_id
    - dim_channel.channel_name
    - dim_region.region_code
    - dim_region.region_id
    - dim_region.region_name
    - fact_order_items.item_paid_amount
    - fact_order_items.order_id
    - fact_orders.channel_id
    - fact_orders.customer_id
    - fact_orders.order_id
    - fact_orders.paid_at
    - fact_orders.shipping_region_id
  scope_contract:
    scope_mode: predicate_safe
