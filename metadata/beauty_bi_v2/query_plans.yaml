- name: order_count_customer_lifecycle_membership_v2
  metric: order_count
  chinese_name: 客户生命周期与支付时会员订单构成
  query_type: scope_local_customer_lifecycle_membership_composition
  result_grain: customer_lifecycle_membership
  description: 把当前窗口成功支付订单划分为新客订单，以及老客在支付时铂金/黄金/白银/青铜/非会员五个互斥层级。新老客判断只使用当前 Effective Scope 内、analysis_start_date 之前的可观察成功支付历史。
  semantic_contract:
    date_attribution: fact_orders.paid_at
    metric_expression: COUNT(DISTINCT report order_id) grouped by scope-local customer lifecycle and payment-time membership
    base_filters:
    - fact_orders.paid_at IS NOT NULL
    - old customer = same-scope customer with successful payment before analysis_start_date
    - new customer = no same-scope successful payment before analysis_start_date and has successful payment in window
    - old-customer membership uses fact_orders.member_level_at_order
    time_window_columns:
    - fact_orders.paid_at
  query_logic:
    stages:
    - stage_id: old_customer_history
      stage_type: aggregate
      source:
        table: fact_orders
        stage_id: null
        alias: hist
      joins: []
      filters:
      - hist.paid_at IS NOT NULL
      - CAST(hist.paid_at AS DATE) < :analysis_start_date
      group_by:
      - hist.customer_id
      having: []
      outputs:
      - field: customer_id
        expression: hist.customer_id
      hidden_control_fields: []
    - stage_id: report_orders
      stage_type: project
      source:
        table: fact_orders
        stage_id: null
        alias: ro
      joins: []
      filters:
      - ro.paid_at IS NOT NULL
      - CAST(ro.paid_at AS DATE) BETWEEN :analysis_start_date AND :analysis_end_date
      group_by: []
      having: []
      outputs:
      - field: order_id
        expression: ro.order_id
      - field: customer_id
        expression: ro.customer_id
      - field: member_level_at_order
        expression: ro.member_level_at_order
      hidden_control_fields: []
    - stage_id: classified_orders
      stage_type: project
      source:
        table: null
        stage_id: report_orders
        alias: r
      joins:
      - stage_id: old_customer_history
        alias: h
        join_type: left
        conditions:
        - left: r.customer_id
          right: h.customer_id
      filters: []
      group_by: []
      having: []
      outputs:
      - field: order_id
        expression: r.order_id
      - field: customer_id
        expression: r.customer_id
      - field: customer_segment
        expression: CASE WHEN h.customer_id IS NULL THEN 'NEW_CUSTOMER' WHEN r.member_level_at_order = 'platinum' THEN 'OLD_PLATINUM' WHEN r.member_level_at_order = 'gold' THEN 'OLD_GOLD' WHEN r.member_level_at_order = 'silver' THEN 'OLD_SILVER' WHEN r.member_level_at_order = 'bronze' THEN 'OLD_BRONZE' WHEN r.member_level_at_order IS NULL THEN 'OLD_NON_MEMBER' ELSE 'OLD_UNKNOWN' END
      hidden_control_fields: []
    - stage_id: final
      stage_type: aggregate
      source:
        table: null
        stage_id: classified_orders
        alias: co
      joins: []
      filters: []
      group_by:
      - co.customer_segment
      having: []
      outputs:
      - field: customer_segment
        expression: co.customer_segment
      - field: order_count
        expression: COUNT(DISTINCT co.order_id)
      hidden_control_fields:
      - field: __group_size
        expression: COUNT(DISTINCT co.customer_id)
        semantics: distinct_customers_per_customer_segment
    final_stage: final
  resource_contract:
    required_tables:
    - dim_channel
    - dim_region
    - fact_orders
    required_columns:
    - dim_channel.channel_code
    - dim_channel.channel_id
    - dim_region.region_code
    - dim_region.region_id
    - fact_orders.channel_id
    - fact_orders.customer_id
    - fact_orders.member_level_at_order
    - fact_orders.order_id
    - fact_orders.paid_at
    - fact_orders.shipping_region_id
  scope_contract:
    scope_mode: predicate_safe
    source_tables:
    - fact_orders
    required_dimensions:
    - channel
    - region
    targets:
    - target_id: order_customer_history_source
      source_table: fact_orders
      table_aliases:
      - table_name: fact_orders
        alias: hist
    - target_id: order_customer_report_source
      source_table: fact_orders
      table_aliases:
      - table_name: fact_orders
        alias: ro
    history_contract: null
  result_contract:
    field_bindings:
    - output_field: customer_segment
      source_columns:
      - fact_orders.customer_id
      - fact_orders.member_level_at_order
      - fact_orders.paid_at
      category: ordinary
      token_namespace: null
    - output_field: order_count
      source_columns:
      - fact_orders.order_id
      category: ordinary
      token_namespace: null
    result_shape: aggregate
    minimum_group_size_required: true
    group_size_field: __group_size
    policy_version: result_protection_v1
  default_sort:
    field: order_count
    direction: desc
- name: refund_rate_overall_v2
  metric: refund_rate
  chinese_name: 整体退款率
  query_type: staged_aggregate_metric
  result_grain: overall
  description: 按整体计算指定销售分析范围内，原订单支付 cohort 最终已完成退款金额占对应原始支付 GMV 的比例。多次部分退款先按 order_item 汇总，避免重复销售分母。
  semantic_contract:
    date_attribution: fact_orders.paid_at
    metric_expression: SUM(item_refund_summary.completed_refund_amount) / NULLIF(SUM(item_refund_summary.item_paid_amount), 0)
    base_filters:
    - fact_orders.paid_at IS NOT NULL
    - only fact_refunds.refund_status = 'completed' contributes to completed_refund_amount
    time_window_columns: []
  query_logic:
    stages:
    - stage_id: item_refund_summary
      stage_type: aggregate
      source:
        table: fact_order_items
        stage_id: null
        alias: foi
      joins:
      - table: fact_orders
        alias: fo
        join_type: inner
        conditions:
        - left: foi.order_id
          right: fo.order_id
      - table: fact_refunds
        alias: fr
        join_type: left
        conditions:
        - left: foi.order_item_id
          right: fr.order_item_id
        - left: foi.order_id
          right: fr.order_id
      filters:
      - fo.paid_at IS NOT NULL
      group_by:
      - foi.order_item_id
      - foi.item_paid_amount
      - fo.customer_id
      having: []
      outputs:
      - field: order_item_id
        expression: foi.order_item_id
      - field: customer_id
        expression: fo.customer_id
      - field: item_paid_amount
        expression: foi.item_paid_amount
      - field: completed_refund_amount
        expression: COALESCE(SUM(fr.refund_amount) FILTER (WHERE fr.refund_status = 'completed'), 0)
      hidden_control_fields: []
    - stage_id: final
      stage_type: aggregate
      source:
        table: null
        stage_id: item_refund_summary
        alias: irs
      joins: []
      filters: []
      group_by: []
      having: []
      outputs:
      - field: refund_rate
        expression: SUM(irs.completed_refund_amount) / NULLIF(SUM(irs.item_paid_amount), 0)
      hidden_control_fields:
      - field: __group_size
        expression: COUNT(DISTINCT irs.customer_id)
        semantics: distinct_buyers_in_sales_cohort
    final_stage: final
  resource_contract:
    required_tables:
    - dim_channel
    - dim_region
    - fact_order_items
    - fact_orders
    - fact_refunds
    required_columns:
    - dim_channel.channel_code
    - dim_channel.channel_id
    - dim_region.region_code
    - dim_region.region_id
    - fact_order_items.item_paid_amount
    - fact_order_items.order_id
    - fact_order_items.order_item_id
    - fact_orders.channel_id
    - fact_orders.customer_id
    - fact_orders.order_id
    - fact_orders.paid_at
    - fact_orders.shipping_region_id
    - fact_refunds.order_id
    - fact_refunds.order_item_id
    - fact_refunds.refund_amount
    - fact_refunds.refund_status
  scope_contract:
    scope_mode: predicate_safe
    source_tables:
    - fact_order_items
    required_dimensions:
    - channel
    - region
    targets:
    - target_id: refund_rate_sales_items
      source_table: fact_order_items
      table_aliases:
      - table_name: fact_order_items
        alias: foi
      - table_name: fact_orders
        alias: fo
    history_contract: null
  result_contract:
    field_bindings:
    - output_field: refund_rate
      source_columns:
      - fact_order_items.item_paid_amount
      - fact_refunds.refund_amount
      - fact_refunds.refund_status
      category: aggregated_business_confidential
      token_namespace: null
    result_shape: aggregate
    minimum_group_size_required: true
    group_size_field: __group_size
    policy_version: result_protection_v1
  default_sort:
    field: refund_rate
    direction: desc
- name: roi_channel_v2
  metric: roi
  chinese_name: 渠道ROI
  query_type: cross_fact_staged_metric
  result_grain: channel
  description: 按渠道计算同一分析时间窗内的 GMV / 营销投放金额。ROI 为倍数，不乘以 100。仅比较同时具备销售和营销能力的启用渠道。
  semantic_contract:
    date_attribution: fact_orders.paid_at
    metric_expression: channel_gmv / marketing_spend_amount
    base_filters:
    - the same analysis_start_date and analysis_end_date apply to paid_at and spend_date
    - dim_channel.is_active = TRUE
    - dim_channel.is_sales_channel = TRUE
    - dim_channel.is_marketing_channel = TRUE
    time_window_columns:
    - fact_orders.paid_at
    - fact_marketing_spend.spend_date
  query_logic:
    stages:
    - stage_id: channel_sales
      stage_type: aggregate
      source:
        table: fact_order_items
        stage_id: null
        alias: foi
      joins:
      - table: fact_orders
        alias: fo
        join_type: inner
        conditions:
        - left: foi.order_id
          right: fo.order_id
      filters:
      - fo.paid_at IS NOT NULL
      - CAST(fo.paid_at AS DATE) BETWEEN :analysis_start_date AND :analysis_end_date
      group_by:
      - fo.channel_id
      having: []
      outputs:
      - field: channel_id
        expression: fo.channel_id
      - field: channel_gmv
        expression: SUM(foi.item_paid_amount)
      - field: buyer_count
        expression: COUNT(DISTINCT fo.customer_id)
      hidden_control_fields: []
    - stage_id: channel_spend
      stage_type: aggregate
      source:
        table: fact_marketing_spend
        stage_id: null
        alias: fms
      joins: []
      filters:
      - fms.spend_date BETWEEN :analysis_start_date AND :analysis_end_date
      group_by:
      - fms.channel_id
      having: []
      outputs:
      - field: channel_id
        expression: fms.channel_id
      - field: marketing_spend_amount
        expression: SUM(fms.spend_amount)
      hidden_control_fields: []
    - stage_id: final
      stage_type: project
      source:
        table: null
        stage_id: channel_sales
        alias: cs
      joins:
      - stage_id: channel_spend
        alias: csp
        join_type: inner
        conditions:
        - left: cs.channel_id
          right: csp.channel_id
      - table: dim_channel
        alias: dc
        join_type: inner
        conditions:
        - left: cs.channel_id
          right: dc.channel_id
      filters:
      - dc.is_active = TRUE
      - dc.is_sales_channel = TRUE
      - dc.is_marketing_channel = TRUE
      group_by: []
      having: []
      outputs:
      - field: channel_name
        expression: dc.channel_name
      - field: roi
        expression: cs.channel_gmv / NULLIF(csp.marketing_spend_amount, 0)
      hidden_control_fields:
      - field: __group_size
        expression: cs.buyer_count
        semantics: distinct_buyers_per_channel
    final_stage: final
  resource_contract:
    required_tables:
    - dim_channel
    - dim_region
    - fact_marketing_spend
    - fact_order_items
    - fact_orders
    required_columns:
    - dim_channel.channel_code
    - dim_channel.channel_id
    - dim_channel.channel_name
    - dim_channel.is_active
    - dim_channel.is_marketing_channel
    - dim_channel.is_sales_channel
    - dim_region.region_code
    - dim_region.region_id
    - fact_marketing_spend.channel_id
    - fact_marketing_spend.spend_amount
    - fact_marketing_spend.spend_date
    - fact_order_items.item_paid_amount
    - fact_order_items.order_id
    - fact_orders.channel_id
    - fact_orders.customer_id
    - fact_orders.order_id
    - fact_orders.paid_at
    - fact_orders.shipping_region_id
  scope_contract:
    scope_mode: predicate_safe
    source_tables:
    - fact_marketing_spend
    - fact_order_items
    required_dimensions:
    - channel
    - region
    targets:
    - target_id: roi_channel_sales
      source_table: fact_order_items
      table_aliases:
      - table_name: fact_order_items
        alias: foi
      - table_name: fact_orders
        alias: fo
    - target_id: roi_channel_spend
      source_table: fact_marketing_spend
      table_aliases:
      - table_name: fact_marketing_spend
        alias: fms
    history_contract: null
  result_contract:
    field_bindings:
    - output_field: channel_name
      source_columns:
      - dim_channel.channel_name
      category: ordinary
      token_namespace: null
    - output_field: roi
      source_columns:
      - fact_marketing_spend.spend_amount
      - fact_order_items.item_paid_amount
      category: business_confidential
      token_namespace: null
    result_shape: aggregate
    minimum_group_size_required: true
    group_size_field: __group_size
    policy_version: result_protection_v1
  default_sort:
    field: roi
    direction: desc
- name: cac_channel_v2
  metric: cac
  chinese_name: 渠道CAC
  query_type: global_history_cross_fact_metric
  result_grain: channel
  description: 按渠道计算同一分析时间窗内营销投放金额 除以渠道支付新客数。渠道支付新客以 customer × channel 的完整历史第一次成功支付为准。
  semantic_contract:
    date_attribution: fact_orders.paid_at
    metric_expression: marketing_spend_amount / channel_paid_new_customer_count
    base_filters:
    - fact_orders.paid_at IS NOT NULL
    - channel first successful payment is determined before the analysis date filter
    - the same analysis_start_date and analysis_end_date apply to first_channel_paid_at and spend_date
    - dim_channel.is_active = TRUE
    - dim_channel.is_sales_channel = TRUE
    - dim_channel.is_marketing_channel = TRUE
    time_window_columns:
    - fact_orders.paid_at
    - fact_marketing_spend.spend_date
  query_logic:
    stages:
    - stage_id: channel_first_paid_history
      stage_type: aggregate
      source:
        table: fact_orders
        stage_id: null
        alias: fo
      joins: []
      filters:
      - fo.paid_at IS NOT NULL
      group_by:
      - fo.customer_id
      - fo.channel_id
      having: []
      outputs:
      - field: customer_id
        expression: fo.customer_id
      - field: channel_id
        expression: fo.channel_id
      - field: first_channel_paid_at
        expression: MIN(fo.paid_at)
      hidden_control_fields: []
    - stage_id: windowed_channel_acquisition
      stage_type: aggregate
      source:
        table: null
        stage_id: channel_first_paid_history
        alias: cfp
      joins: []
      filters:
      - CAST(cfp.first_channel_paid_at AS DATE) BETWEEN :analysis_start_date AND :analysis_end_date
      group_by:
      - cfp.channel_id
      having: []
      outputs:
      - field: channel_id
        expression: cfp.channel_id
      - field: channel_paid_new_customer_count
        expression: COUNT(DISTINCT cfp.customer_id)
      hidden_control_fields: []
    - stage_id: channel_spend
      stage_type: aggregate
      source:
        table: fact_marketing_spend
        stage_id: null
        alias: fms
      joins: []
      filters:
      - fms.spend_date BETWEEN :analysis_start_date AND :analysis_end_date
      group_by:
      - fms.channel_id
      having: []
      outputs:
      - field: channel_id
        expression: fms.channel_id
      - field: marketing_spend_amount
        expression: SUM(fms.spend_amount)
      hidden_control_fields: []
    - stage_id: final
      stage_type: project
      source:
        table: null
        stage_id: windowed_channel_acquisition
        alias: wca
      joins:
      - stage_id: channel_spend
        alias: csp
        join_type: inner
        conditions:
        - left: wca.channel_id
          right: csp.channel_id
      - table: dim_channel
        alias: dc
        join_type: inner
        conditions:
        - left: wca.channel_id
          right: dc.channel_id
      filters:
      - dc.is_active = TRUE
      - dc.is_sales_channel = TRUE
      - dc.is_marketing_channel = TRUE
      group_by: []
      having: []
      outputs:
      - field: channel_name
        expression: dc.channel_name
      - field: cac
        expression: csp.marketing_spend_amount / NULLIF(wca.channel_paid_new_customer_count, 0)
      hidden_control_fields:
      - field: __group_size
        expression: wca.channel_paid_new_customer_count
        semantics: channel_paid_new_customers_per_channel
    final_stage: final
  resource_contract:
    required_tables:
    - dim_channel
    - dim_region
    - fact_marketing_spend
    - fact_orders
    required_columns:
    - dim_channel.channel_code
    - dim_channel.channel_id
    - dim_channel.channel_name
    - dim_channel.is_active
    - dim_channel.is_marketing_channel
    - dim_channel.is_sales_channel
    - dim_region.region_code
    - dim_region.region_id
    - fact_marketing_spend.channel_id
    - fact_marketing_spend.spend_amount
    - fact_marketing_spend.spend_date
    - fact_orders.channel_id
    - fact_orders.customer_id
    - fact_orders.order_id
    - fact_orders.paid_at
    - fact_orders.shipping_region_id
  scope_contract:
    scope_mode: global_history_required
    source_tables:
    - fact_marketing_spend
    - fact_orders
    required_dimensions:
    - channel
    - region
    targets:
    - target_id: cac_channel_acquisition
      source_table: fact_orders
      table_aliases:
      - table_name: fact_orders
        alias: fo
    - target_id: cac_channel_spend
      source_table: fact_marketing_spend
      table_aliases:
      - table_name: fact_marketing_spend
        alias: fms
    history_contract:
      history_stage_id: channel_first_paid_history
      analysis_window_stage_id: windowed_channel_acquisition
      history_source_tables:
      - fact_orders
      sequence_partition_by:
      - fo.customer_id
      - fo.channel_id
      sequence_order_by:
      - fo.paid_at
      - fo.order_id
      pre_sequence_scope_bindings:
      - dimension: channel
        partition_reference: fo.channel_id
      post_sequence_scope_dimensions:
      - region
      analysis_window_parameters:
      - analysis_start_date
      - analysis_end_date
  result_contract:
    field_bindings:
    - output_field: channel_name
      source_columns:
      - dim_channel.channel_name
      category: ordinary
      token_namespace: null
    - output_field: cac
      source_columns:
      - fact_marketing_spend.spend_amount
      - fact_orders.channel_id
      - fact_orders.customer_id
      - fact_orders.paid_at
      category: business_confidential
      token_namespace: null
    result_shape: aggregate
    minimum_group_size_required: true
    group_size_field: __group_size
    policy_version: result_protection_v1
  default_sort:
    field: cac
    direction: asc
- name: brand_paid_new_customer_count_overall_v2
  metric: brand_paid_new_customer_count
  chinese_name: 品牌支付新客数
  query_type: global_history_first_event_metric
  result_grain: overall
  description: 统计真实品牌首单支付时间落入分析窗口的 customer 数量。品牌首单从完整成功支付历史中按 customer 确定，每个 customer 在品牌生命周期中最多成为一次品牌新客。
  semantic_contract:
    date_attribution: fact_orders.paid_at
    metric_expression: COUNT(DISTINCT customer_id whose true brand-first paid order falls within the analysis window)
    base_filters:
    - fact_orders.paid_at IS NOT NULL
    - brand first successful payment is determined before the analysis date filter
    time_window_columns:
    - fact_orders.paid_at
  query_logic:
    stages:
    - stage_id: brand_order_sequence
      stage_type: project
      source:
        table: fact_orders
        stage_id: null
        alias: fo
      joins: []
      filters:
      - fo.paid_at IS NOT NULL
      group_by: []
      having: []
      outputs:
      - field: customer_id
        expression: fo.customer_id
      - field: order_id
        expression: fo.order_id
      - field: paid_at
        expression: fo.paid_at
      - field: channel_id
        expression: fo.channel_id
      - field: shipping_region_id
        expression: fo.shipping_region_id
      - field: event_rank
        expression: ROW_NUMBER() OVER (PARTITION BY fo.customer_id ORDER BY fo.paid_at ASC, fo.order_id ASC)
      hidden_control_fields: []
    - stage_id: true_brand_first_paid
      stage_type: filter
      source:
        table: null
        stage_id: brand_order_sequence
        alias: bos
      joins: []
      filters:
      - bos.event_rank = 1
      group_by: []
      having: []
      outputs:
      - field: customer_id
        expression: bos.customer_id
      - field: first_paid_at
        expression: bos.paid_at
      - field: first_channel_id
        expression: bos.channel_id
      - field: first_shipping_region_id
        expression: bos.shipping_region_id
      hidden_control_fields: []
    - stage_id: windowed_brand_acquisition
      stage_type: aggregate
      source:
        table: null
        stage_id: true_brand_first_paid
        alias: bfp
      joins: []
      filters:
      - CAST(bfp.first_paid_at AS DATE) BETWEEN :analysis_start_date AND :analysis_end_date
      group_by: []
      having: []
      outputs:
      - field: brand_paid_new_customer_count
        expression: COUNT(DISTINCT bfp.customer_id)
      hidden_control_fields:
