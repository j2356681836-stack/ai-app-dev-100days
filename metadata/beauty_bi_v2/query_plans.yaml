- name: cac_channel_v2
  metric: cac
  chinese_name: 渠道CAC
  query_type: global_history_cross_fact_metric
  result_grain: channel
  description: 按渠道计算同一分析时间窗内营销投放金额 除以渠道支付新客数。渠道支付新客以 customer × channel 的完整历史第一次成功支付为准。
  semantic_contract:
    date_attribution: fact_orders.paid_at
    metric_expression: marketing_spend_amount / channel_paid_new_customer_count
    base_filters:
    - fact_orders.paid_at IS NOT NULL
    - channel first successful payment is determined before the analysis date filter
    - the same analysis_start_date and analysis_end_date apply to first_channel_paid_at and spend_date
    - dim_channel.is_active = TRUE
    - dim_channel.is_sales_channel = TRUE
    - dim_channel.is_marketing_channel = TRUE
    time_window_columns:
    - fact_orders.paid_at
    - fact_marketing_spend.spend_date
  query_logic:
    stages:
    - stage_id: channel_first_paid_history
      stage_type: aggregate
      source:
        table: fact_orders
        stage_id: null
        alias: fo
      joins: []
      filters:
      - fo.paid_at IS NOT NULL
      group_by:
      - fo.customer_id
      - fo.channel_id
      having: []
      outputs:
      - field: customer_id
        expression: fo.customer_id
      - field: channel_id
        expression: fo.channel_id
      - field: first_channel_paid_at
        expression: MIN(fo.paid_at)
      hidden_control_fields: []
    - stage_id: windowed_channel_acquisition
      stage_type: aggregate
      source:
        table: null
        stage_id: channel_first_paid_history
        alias: cfp
      joins: []
      filters:
      - CAST(cfp.first_channel_paid_at AS DATE) BETWEEN :analysis_start_date AND :analysis_end_date
      group_by:
      - cfp.channel_id
      having: []
      outputs:
      - field: channel_id
        expression: cfp.channel_id
      - field: channel_paid_new_customer_count
        expression: COUNT(DISTINCT cfp.customer_id)
      hidden_control_fields: []
    - stage_id: channel_spend
      stage_type: aggregate
      source:
        table: fact_marketing_spend
        stage_id: null
        alias: fms
      joins: []
      filters:
      - fms.spend_date BETWEEN :analysis_start_date AND :analysis_end_date
      group_by:
      - fms.channel_id
      having: []
      outputs:
      - field: channel_id
        expression: fms.channel_id
      - field: marketing_spend_amount
        expression: SUM(fms.spend_amount)
      hidden_control_fields: []
    - stage_id: final
      stage_type: project
      source:
        table: null
        stage_id: windowed_channel_acquisition
        alias: wca
      joins:
      - stage_id: channel_spend
        alias: csp
        join_type: inner
        conditions:
        - left: wca.channel_id
          right: csp.channel_id
      - table: dim_channel
        alias: dc
        join_type: inner
        conditions:
        - left: wca.channel_id
          right: dc.channel_id
      filters:
      - dc.is_active = TRUE
      - dc.is_sales_channel = TRUE
      - dc.is_marketing_channel = TRUE
      group_by: []
      having: []
      outputs:
      - field: channel_name
        expression: dc.channel_name
      - field: cac
        expression: csp.marketing_spend_amount / NULLIF(wca.channel_paid_new_customer_count, 0)
      hidden_control_fields:
      - field: __group_size
        expression: wca.channel_paid_new_customer_count
        semantics: channel_paid_new_customers_per_channel
    final_stage: final
  resource_contract:
    required_tables:
    - dim_channel
    - dim_region
    - fact_marketing_spend
    - fact_orders
    required_columns:
    - dim_channel.channel_code
    - dim_channel.channel_id
    - dim_channel.channel_name
    - dim_channel.is_active
    - dim_channel.is_marketing_channel
    - dim_channel.is_sales_channel
    - dim_region.region_code
    - dim_region.region_id
    - fact_marketing_spend.channel_id
    - fact_marketing_spend.spend_amount
    - fact_marketing_spend.spend_date
    - fact_orders.channel_id
    - fact_orders.customer_id
    - fact_orders.order_id
    - fact_orders.paid_at
    - fact_orders.shipping_region_id
  scope_contract:
    scope_mode: global_history_required
    source_tables:
    - fact_marketing_spend
    - fact_orders
    required_dimensions:
    - channel
    - region
    targets:
    - target_id: cac_channel_acquisition
      source_table: fact_orders
      table_aliases:
      - table_name: fact_orders
        alias: fo
    - target_id: cac_channel_spend
      source_table: fact_marketing_spend
      table_aliases:
      - table_name: fact_marketing_spend
        alias: fms
    history_contract:
      history_stage_id: channel_first_paid_history
      analysis_window_stage_id: windowed_channel_acquisition
      history_source_tables:
      - fact_orders
      sequence_partition_by:
      - fo.customer_id
      - fo.channel_id
      sequence_order_by:
      - fo.paid_at
      - fo.order_id
      pre_sequence_scope_bindings:
      - dimension: channel
        partition_reference: fo.channel_id
      post_sequence_scope_dimensions:
      - region
      analysis_window_parameters:
      - analysis_start_date
      - analysis_end_date
  result_contract:
    field_bindings:
    - output_field: channel_name
      source_columns:
      - dim_channel.channel_name
      category: ordinary
      token_namespace: null
    - output_field: cac
      source_columns:
      - fact_marketing_spend.spend_amount
      - fact_orders.channel_id
      - fact_orders.customer_id
      - fact_orders.paid_at
      category: business_confidential
      token_namespace: null
    result_shape: aggregate
    minimum_group_size_required: true
    group_size_field: __group_size
    policy_version: result_protection_v1
  default_sort:
    field: cac
    direction: asc
- name: brand_paid_new_customer_count_overall_v2
  metric: brand_paid_new_customer_count
  chinese_name: 品牌支付新客数
  query_type: global_history_first_event_metric
  result_grain: overall
  description: 统计真实品牌首单支付时间落入分析窗口的 customer 数量。品牌首单从完整成功支付历史中按 customer 确定，每个 customer 在品牌生命周期中最多成为一次品牌新客。
  semantic_contract:
    date_attribution: fact_orders.paid_at
    metric_expression: COUNT(DISTINCT customer_id whose true brand-first paid order falls within the analysis window)
    base_filters:
    - fact_orders.paid_at IS NOT NULL
    - brand first successful payment is determined before the analysis date filter
    time_window_columns:
    - fact_orders.paid_at
  query_logic:
    stages:
    - stage_id: brand_order_sequence
      stage_type: project
      source:
        table: fact_orders
        stage_id: null
        alias: fo
      joins: []
      filters:
      - fo.paid_at IS NOT NULL
      group_by: []
      having: []
      outputs:
      - field: customer_id
        expression: fo.customer_id
      - field: order_id
        expression: fo.order_id
      - field: paid_at
        expression: fo.paid_at
      - field: channel_id
        expression: fo.channel_id
      - field: shipping_region_id
        expression: fo.shipping_region_id
      - field: event_rank
        expression: ROW_NUMBER() OVER (PARTITION BY fo.customer_id ORDER BY fo.paid_at ASC, fo.order_id ASC)
      hidden_control_fields: []
    - stage_id: true_brand_first_paid
      stage_type: filter
      source:
        table: null
        stage_id: brand_order_sequence
        alias: bos
      joins: []
      filters:
      - bos.event_rank = 1
      group_by: []
      having: []
      outputs:
      - field: customer_id
        expression: bos.customer_id
      - field: first_paid_at
        expression: bos.paid_at
      - field: first_channel_id
        expression: bos.channel_id
      - field: first_shipping_region_id
        expression: bos.shipping_region_id
      hidden_control_fields: []
    - stage_id: windowed_brand_acquisition
      stage_type: aggregate
      source:
        table: null
        stage_id: true_brand_first_paid
        alias: bfp
      joins: []
      filters:
      - CAST(bfp.first_paid_at AS DATE) BETWEEN :analysis_start_date AND :analysis_end_date
      group_by: []
      having: []
      outputs:
      - field: brand_paid_new_customer_count
        expression: COUNT(DISTINCT bfp.customer_id)
      hidden_control_fields:
      - field: __group_size
        expression: COUNT(DISTINCT bfp.customer_id)
        semantics: brand_paid_new_customers_in_analysis_period
    final_stage: windowed_brand_acquisition
  resource_contract:
    required_tables:
    - dim_channel
    - dim_region
    - fact_orders
    required_columns:
    - dim_channel.channel_code
    - dim_channel.channel_id
    - dim_region.region_code
    - dim_region.region_id
    - fact_orders.channel_id
    - fact_orders.customer_id
    - fact_orders.order_id
    - fact_orders.paid_at
    - fact_orders.shipping_region_id
  scope_contract:
    scope_mode: global_history_required
    source_tables:
    - fact_orders
    required_dimensions:
    - channel
    - region
    targets:
    - target_id: brand_first_paid_orders
      source_table: fact_orders
      table_aliases:
      - table_name: fact_orders
        alias: fo
    history_contract:
      history_stage_id: brand_order_sequence
      analysis_window_stage_id: windowed_brand_acquisition
      history_source_tables:
      - fact_orders
      sequence_partition_by:
      - fo.customer_id
      sequence_order_by:
      - fo.paid_at
      - fo.order_id
      pre_sequence_scope_bindings: []
      post_sequence_scope_dimensions:
      - channel
      - region
      analysis_window_parameters:
      - analysis_start_date
      - analysis_end_date
  result_contract:
    field_bindings:
    - output_field: brand_paid_new_customer_count
      source_columns:
      - fact_orders.customer_id
      - fact_orders.order_id
      - fact_orders.paid_at
      category: ordinary
      token_namespace: null
    result_shape: aggregate
    minimum_group_size_required: true
    group_size_field: __group_size
    policy_version: result_protection_v1
  default_sort:
    field: brand_paid_new_customer_count
    direction: desc
