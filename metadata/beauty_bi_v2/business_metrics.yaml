metadata_version: beauty_bi_metadata_v2_0
dataset_name: beauty_bi_v2
target_schema: beauty_bi_v2
status: draft
metrics:
- name: gmv
  chinese_name: 销售额
  aliases:
  - GMV
  - 成交额
  - 支付金额
  - 实付销售额
  - 销售金额
  grain: paid_order_items
  definition: '在指定分析范围内，所有成功支付订单明细的实际支付金额总和。 仅统计 paid_at 非空的订单。 GMV 表示支付时确认的交易销售额，不因后续退款而回溯扣减。

    '
  formula: 'SUM(fact_order_items.item_paid_amount)

    '
  tables:
  - fact_orders
  - fact_order_items
  filters:
  - fact_orders.paid_at IS NOT NULL
  examples:
  - 2025年GMV是多少
  - 各渠道GMV排名
  - 哪个地区销售额最高
  - 2025年各品类成交额
  negative_examples:
  - 2025年毛利额是多少
  - 哪个渠道毛利率最高
  - 退款金额是多少
  - 扣除退款后的销售额是多少
  ranking_preference: higher_is_better
- name: gross_margin
  chinese_name: 毛利额
  aliases:
  - 毛利
  - 毛利润
  - 商品毛利
  - 销售毛利
  grain: paid_order_items
  definition: '在指定分析范围内，所有成功支付订单明细的实际支付金额 扣除对应商品成本后的毛利金额总和。 该指标表示商品交易层面的毛利，不扣除营销、人工、仓储、 管理等其他经营费用，也不因后续退款而回溯扣减。

    '
  formula: "SUM(\n  fact_order_items.item_paid_amount\n  - fact_order_items.item_cost_amount\n)\n"
  tables:
  - fact_orders
  - fact_order_items
  filters:
  - fact_orders.paid_at IS NOT NULL
  examples:
  - 2025年毛利额是多少
  - 各渠道毛利额排名
  - 哪个品类毛利最高
  - 2025年各品类商品毛利
  negative_examples:
  - 2025年销售额是多少
  - 哪个渠道毛利率最高
  - 2025年净利润是多少
  - 哪个渠道利润率最高
  - 退款金额是多少
  ranking_preference: higher_is_better
- name: gross_margin_rate
  chinese_name: 毛利率
  aliases:
  - 销售毛利率
  - 商品毛利率
  - 毛利占比
  grain: paid_order_items
  definition: '在指定分析范围内，成功支付订单产生的商品毛利额 占对应 GMV 的比例。 该指标衡量每单位支付销售额中有多少比例形成商品毛利， 不等同于净利润率或其他经营利润率。

    '
  formula: "SUM(\n  fact_order_items.item_paid_amount\n  - fact_order_items.item_cost_amount\n) / NULLIF(\n  SUM(fact_order_items.item_paid_amount),\n  0\n)\n"
  tables:
  - fact_orders
  - fact_order_items
  filters:
  - fact_orders.paid_at IS NOT NULL
  examples:
  - 2025年毛利率是多少
  - 各渠道毛利率排名
  - 哪个品类毛利率最高
  - 2025年各品类销售毛利率
  negative_examples:
  - 2025年毛利额是多少
  - 哪个渠道GMV最高
  - 2025年净利润率是多少
  - 哪个渠道利润最高
  - 退款率是多少
  ranking_preference: higher_is_better
- name: refund_rate
  chinese_name: 退款率
  aliases:
  - 金额退款率
  - 销售退款率
  - 成交退款率
  - 退款金额占比
  grain: paid_order_items
  definition: '在指定销售分析范围内，成功支付订单最终已完成退款的金额 占对应原始支付销售金额的比例。 仅 refund_status 为 completed 的退款进入退款金额； rejected、cancelled 和尚未完成的 requested 退款不计入分子。 退款归属原订单的 paid_at，用于衡量对应销售 cohort 的退款程度， 不表示按 refund_completed_at 统计的售后退款发生趋势。

    '
  formula: "SUM(completed_refund_amount) / NULLIF(\n  SUM(fact_order_items.item_paid_amount),\n  0\n)\n"
  tables:
  - fact_orders
  - fact_order_items
  - fact_refunds
  filters:
  - fact_orders.paid_at IS NOT NULL
  - fact_refunds.refund_status = 'completed' only contributes to completed_refund_amount
  - completed refunds are attributed to the original order paid_at for this metric
  examples:
  - 2025年退款率是多少
  - 哪个品类退款率最高
  - 各渠道退款率排名
  - 2025年各品类销售退款率
  negative_examples:
  - 2025年退款金额是多少
  - 2026年1月发生了多少退款
  - 退款申请数量是多少
  - 哪个品类退款订单数最多
  - 2025年GMV是多少
  ranking_preference: lower_is_better
- name: roi
  chinese_name: 营销投资回报率
  aliases:
  - ROI
  - 营销ROI
  - 投放ROI
  - 广告ROI
  - 投产比
  - 投放产出比
  grain: channel
  definition: '在指定分析时间范围内，直接响应渠道产生的成功支付 GMV 与该渠道同期营销投入金额的比值。 本项目 ROI 定义为 GMV / Marketing Spend，结果表示倍率而非百分比， 不扣除商品成本、退款及其他经营费用。 没有直接销售归因能力的 marketing-only 渠道不纳入直接响应 ROI 比较。

    '
  formula: "SUM(channel_gmv) / NULLIF(\n  SUM(fact_marketing_spend.spend_amount),\n  0\n)\n"
  tables:
  - fact_orders
  - fact_order_items
  - fact_marketing_spend
  - dim_channel
  filters:
  - fact_orders.paid_at IS NOT NULL
  - sales and marketing spend use the same analysis date range
  - sales and marketing spend are matched by channel
  - only direct-response channels participate in ROI comparison
  examples:
  - 2025年各渠道ROI是多少
  - 哪个渠道投放ROI最高
  - 各渠道投产比排名
  - 2025年下半年各渠道营销ROI
  negative_examples:
  - 2025年毛利率是多少
  - 哪个渠道毛利额最高
  - 各渠道营销费用是多少
  - 哪个地区ROI最高
  - 每投入一元营销费产生多少毛利
  ranking_preference: higher_is_better
- name: cac
  chinese_name: 获客成本
  aliases:
  - CAC
  - 客户获取成本
  - 新客获取成本
  - 渠道获客成本
  - 拉新成本
  grain: channel
  definition: '在指定分析时间范围内，直接响应渠道的营销投入金额 除以该渠道同期产生的渠道支付新客数。 渠道支付新客指 customer 在该 channel 的第一次成功支付， 首次支付必须基于完整历史订单确定，再判断该首次支付事件 是否落入当前分析时间范围。 后续退款不改变已经发生的首次成功支付事件。 本指标不等同于渠道贡献品牌新客的获客成本。

    '
  formula: "SUM(fact_marketing_spend.spend_amount) / NULLIF(\n  channel_paid_new_customer_count,\n  0\n)\n"
  tables:
  - fact_orders
  - fact_marketing_spend
  - dim_channel
  filters:
  - fact_orders.paid_at IS NOT NULL
  - channel first successful payment is determined from full payment history
  - first channel payment event must fall within the analysis date range
  - marketing spend uses the same analysis date range
  - acquisition events and marketing spend are matched by channel
  - only direct-response channels participate in CAC comparison
  examples:
  - 2025年各渠道CAC是多少
  - 哪个渠道获客成本最低
  - 各渠道拉新成本排名
  - 2025年下半年各渠道新客获取成本
  negative_examples:
  - 2025年各渠道ROI是多少
  - 哪个渠道营销费用最高
  - 2025年品牌新客有多少
  - 哪个渠道贡献的品牌新客最多
  - 哪个地区获客成本最低
  - 每获得一个品牌新客需要多少钱
  ranking_preference: lower_is_better
- name: brand_paid_new_customer_count
  chinese_name: 品牌支付新客数
  aliases:
  - 品牌新客数
  - 品牌支付新客
  - 首次购买客户数
  - 品牌首次购买客户数
  - 首购客户数
  grain: customer_first_paid_event
  definition: '在指定分析时间范围内，首次完成品牌成功支付的 customer 数量。 每个 customer 在整个品牌生命周期中最多只会成为一次品牌支付新客。 首次支付必须基于完整历史成功支付订单确定， 再判断该首次支付事件是否落入当前分析时间范围。 客户后续发生退款、再次购买或进入其他渠道， 都不会改变已经发生的品牌首次支付事件。

    '
  formula: "COUNT(\n  customer where global_brand_paid_sequence = 1\n  and first_brand_paid_at is within analysis date range\n)\n"
  tables:
  - fact_orders
  filters:
  - fact_orders.paid_at IS NOT NULL
  - brand first successful payment is determined from full payment history
  - first brand payment event must fall within the analysis date range
  examples:
  - 2025年品牌支付新客有多少
  - 2025年品牌首次购买客户数是多少
  - 每月品牌新客趋势
  - 2024年和2025年品牌新客对比
  negative_examples:
  - 2025年各渠道新客有多少
  - 哪个渠道新客最多
  - 2025年复购客户有多少
  - 2025年注册用户有多少
  - 2025年会员新增多少
- name: channel_paid_new_customer_count
  chinese_name: 渠道支付新客数
  aliases:
  - 渠道新客数
  - 渠道支付新客
  - 渠道首次购买客户数
  - 首次进入渠道客户数
  - 渠道拉新人数
  grain: customer_channel_first_paid_event
  definition: '在指定分析时间范围内，customer 在某个 channel 首次完成成功支付所形成的渠道支付新客数量。 同一个 customer 可以分别成为多个渠道的渠道支付新客， 但在同一个 channel 中最多只会成为一次渠道支付新客。 渠道首次支付必须基于该 customer 在该 channel 的完整历史成功支付订单确定， 再判断首次支付事件是否落入当前分析时间范围。 后续退款不改变已经发生的渠道首次支付事件。

    '
  formula: "COUNT(\n  customer-channel where channel_paid_sequence = 1\n  and first_channel_paid_at is within analysis date range\n)\n"
  tables:
  - fact_orders
  - dim_channel
  filters:
  - fact_orders.paid_at IS NOT NULL
  - channel first successful payment is determined from full payment history
  - first channel payment event must fall within the analysis date range
  examples:
  - 2025年各渠道支付新客有多少
  - 哪个渠道新客最多
  - 各渠道首次购买客户数排名
  - 2025年每月各渠道新客趋势
  negative_examples:
  - 2025年品牌新客有多少
  - 2025年全品牌首次购买客户数
  - 哪个渠道贡献的品牌新客最多
  - 2025年复购客户有多少
  - 2025年注册用户有多少
  ranking_preference: higher_is_better
- name: repeat_customer_rate
  chinese_name: 跨日复购率
  aliases:
  - 按购买日复购率
  - 跨购买日复购率
  - 同日多单计一次复购率
  grain: customer_purchase_period
  definition: '在指定分析时间范围内，至少在两个不同支付日期发生成功购买的 customer 数，占同期所有成功支付购买客户数的比例。 同一个 customer 在同一天产生多张支付订单时，该日期只视为一个购买日。 本指标用于衡量报告周期内客户再次发生购买行为的比例， 不等同于两单及以上客户占比，也不等同于首购后30日、90日等 Cohort 新客复购率。

    '
  formula: "repeat_customer_count / NULLIF(\n  buyer_count,\n  0\n)\n"
  tables:
  - fact_orders
  filters:
  - fact_orders.paid_at IS NOT NULL
  - purchase days are determined by distinct fact_orders.paid_at dates
  - customer must have at least two distinct paid dates to be a repeat customer
  examples:
  - 2025年整体复购率是多少
  - 2025年购买客户复购率
  - 2024年和2025年复购率对比
  - 每月跨日复购率趋势
  negative_examples:
  - 2025年平均购买次数是多少
  - 2025年两单及以上客户有多少
  - 双11新客30天复购率是多少
  - 2025年品牌新客有多少
- name: member_gmv_share
  chinese_name: 会员GMV贡献率
  aliases:
  - 会员销售贡献率
  - 会员销售占比
  - 会员GMV占比
  - 会员消费贡献率
  - 会员销售金额占比
  grain: paid_order_items
  definition: '在指定分析时间范围内，支付时点具有会员身份的订单所产生的 GMV， 占同期全部成功支付 GMV 的比例。 会员身份使用 fact_orders.member_level_at_order 的支付时点快照判断， 不使用客户当前会员状态回溯历史交易。 本指标衡量会员销售对整体 GMV 的贡献程度， 不代表会员人数占比、会员增量贡献或利润贡献。

    '
  formula: "SUM(\n  member_order_item_paid_amount\n) / NULLIF(\n  SUM(fact_order_items.item_paid_amount),\n  0\n)\n"
  tables:
  - fact_orders
  - fact_order_items
  filters:
  - fact_orders.paid_at IS NOT NULL
  - member transactions require fact_orders.member_level_at_order IS NOT NULL
  examples:
  - 2025年会员GMV贡献率是多少
  - 会员销售占整体销售多少
  - 今年会员GMV占比
  - 各会员等级GMV贡献率
  negative_examples:
  - 会员人数占比是多少
  - 会员人均消费是多少
  - 会员贡献了多少毛利
  - 非会员销售额是多少
- name: buyer_count
  chinese_name: 购买人数
  aliases:
  - 购买客户数
  - 购买用户数
  - 成交人数
  - 支付买家数
  - 买家数
  grain: customer
  definition: '在指定分析时间范围内，至少完成一次成功支付的去重 customer 数量。 同一 customer 无论产生多少张支付订单都只计为一个购买客户。

    '
  formula: 'COUNT(DISTINCT fact_orders.customer_id)

    '
  tables:
  - fact_orders
  filters:
  - fact_orders.paid_at IS NOT NULL
  examples:
  - 2025年购买人数是多少
  - 各渠道购买客户数
  - 今年成交人数有多少
  - 每月支付买家数趋势
  negative_examples:
  - 2025年订单量是多少
  - 2025年品牌新客有多少
  - 2025年复购人数是多少
  - 会员人数有多少
  ranking_preference: higher_is_better
- name: order_count
  chinese_name: 订单数
  aliases:
  - 订单量
  - 支付订单量
  - 支付订单数
  - 成交订单数
  - 交易笔数
  - 支付单量
  - 交易量
  grain: paid_order
  definition: '在指定分析时间范围内，成功支付订单的数量。 仅统计 paid_at 非空的订单，不包含待支付或取消且未支付的订单。

    '
  formula: 'COUNT(DISTINCT fact_orders.order_id)

    '
  tables:
  - fact_orders
  filters:
  - fact_orders.paid_at IS NOT NULL
  examples:
  - 2025年支付订单量是多少
  - 各渠道订单量排名
  - 每月成交订单数
  - 双11支付单量是多少
  negative_examples:
  - 2025年购买人数是多少
  - 2025年交易件数是多少
  - 创建订单数是多少
  - 取消订单数是多少
  ranking_preference: higher_is_better
- name: units_sold
  chinese_name: 交易件数
  aliases:
  - 支付件数
  - 销售件数
  - 成交件数
  - 销量
  - 商品件数
  grain: paid_order_items
  definition: '在指定分析时间范围内，成功支付订单明细的商品 quantity 总和。 一个订单可以包含多种商品和多件商品，因此交易件数不等同于订单量。

    '
  formula: 'SUM(fact_order_items.quantity)

    '
  tables:
  - fact_orders
  - fact_order_items
  filters:
  - fact_orders.paid_at IS NOT NULL
  examples:
  - 2025年交易件数是多少
  - 哪个品类销量最高
  - 各渠道成交件数排名
  - 每月销售件数趋势
  negative_examples:
  - 2025年订单量是多少
  - 2025年购买人数是多少
  - 平均每单买几件
  - 平均销售单价是多少
  ranking_preference: higher_is_better
- name: spending_per_buyer
  chinese_name: 人均消费金额
  aliases:
  - Spending
  - 人均消费
  - 人均消费额
  - 人均销售额
  - 买家人均消费
  grain: buyer_period
  definition: 在指定分析时间范围内，成功支付 GMV 除以同期购买人数。该指标衡量平均每个实际购买客户贡献的支付销售金额。在本项目 Bench 口径下，Spending = AUS × FREQ。不等同于单笔交易金额或客户生命周期价值。
  formula: "gmv / NULLIF(\n  buyer_count,\n  0\n)\n"
  tables:
  - fact_orders
  - fact_order_items
  filters:
  - fact_orders.paid_at IS NOT NULL
  examples:
  - 2025年Spending是多少
  - 今年人均消费金额
  - 各渠道买家人均消费
  - 每月人均消费趋势
  negative_examples:
  - 平均每单多少钱
  - AUS是多少
  - 客户生命周期价值是多少
  - 2025年GMV是多少
- name: ipt
  chinese_name: 每单件数
  aliases:
  - IPT
  - 平均每单件数
  - 件单数
  - 件单量
  - 连带率
  grain: paid_order
  definition: 在指定分析时间范围内，成功支付交易件数除以同期交易量，表示平均每笔成功支付交易包含多少件商品。本项目 IPT 固定采用“交易件数 / 交易量”口径。
  formula: units_sold / NULLIF(order_count, 0)
  tables:
  - fact_orders
  - fact_order_items
  filters:
  - fact_orders.paid_at IS NOT NULL
  examples:
  - 2025年IPT是多少
  - 平均每单买几件
  - 各渠道每单件数
  - 每月IPT趋势
  negative_examples:
  - 平均每件卖多少钱
  - 人均买了几单
  - 交易件数是多少
  - 订单量是多少
- name: aus
  chinese_name: 平均交易金额
  aliases:
  - AUS
  - 平均交易金额
  - 平均每笔交易金额
  - 平均成交金额
  - 平均每单销售金额
  grain: paid_order_items
  definition: 在指定分析时间范围内，成功支付 GMV 除以同期交易量，表示平均每笔成功支付交易对应的销售金额。本项目 AUS 采用“销售金额 / 交易量”口径，不表示平均每件商品销售单价。
  formula: gmv / NULLIF(order_count, 0)
  tables:
  - fact_orders
  - fact_order_items
  filters:
  - fact_orders.paid_at IS NOT NULL
  examples:
  - 2025年AUS是多少
  - 平均每笔交易金额是多少
  - 各渠道AUS
  - 每月平均交易金额趋势
  negative_examples:
  - 平均每件商品卖多少钱
  - 商品平均吊牌价是多少
  - IPT是多少
  - 交易件数是多少
- name: purchase_frequency
  chinese_name: 平均购买频次
  aliases:
  - FREQ
  - 购买频次
  - 平均购买次数
  - 人均订单数
  - 人均购买频次
  grain: buyer_period
  definition: 在指定分析时间范围内，交易量除以同期购买人数，表示每个实际购买客户平均产生的成功支付交易次数。该指标是平均交易频次，不等同于发生复购的客户比例。
  formula: "order_count / NULLIF(\n  buyer_count,\n  0\n)\n"
  tables:
  - fact_orders
  filters:
  - fact_orders.paid_at IS NOT NULL
  examples:
  - 2025年FREQ是多少
  - 今年平均购买次数
  - 各渠道人均订单数
  - 每月购买频次趋势
  negative_examples:
  - 2025年复购率是多少
  - 复购人数是多少
  - 两单及以上购买人数是多少
  - 订单量是多少
- name: repeat_customer_count
  chinese_name: 跨日复购人数
  aliases:
  - 跨日复购客户数
  - 按购买日复购人数
  - 跨购买日复购人数
  - 同日多单计一次复购人数
  grain: customer_purchase_period
  definition: '在指定分析时间范围内，至少在两个不同支付日期发生成功购买的 customer 数量。 同一 customer 在同一天产生多张支付订单时， 该日期只视为一个购买日，因此不会仅因同日多单而被认定为复购客户。

    '
  formula: "COUNT(\n  customer where COUNT(DISTINCT paid_date) >= 2\n)\n"
  tables:
  - fact_orders
  filters:
  - fact_orders.paid_at IS NOT NULL
  - purchase days are determined by distinct fact_orders.paid_at dates
  examples:
  - 2025年跨日复购人数是多少
  - 今年跨日复购客户数
  - 每月跨日复购人数趋势
  - 2024年和2025年跨日复购客户数对比
  negative_examples:
  - 两单及以上购买人数是多少
  - 2025年复购率是多少
  - 2025年品牌新客有多少
  - FREQ是多少
- name: multi_order_customer_count
  chinese_name: 两单及以上购买人数
  aliases:
  - 多单客户数
  - 两单以上客户数
  - 两单及以上客户数
  - 多订单购买人数
  - 2单口径复购人数
  - 两单及以上复购人数
  grain: customer_purchase_period
  definition: '在指定分析时间范围内，产生至少两张成功支付订单的 customer 数量。 多张订单即使发生于同一个支付日期，也分别计入订单数量。 该指标反映多订单客户规模，不等同于跨日复购人数。

    '
  formula: "COUNT(\n  customer where COUNT(DISTINCT fact_orders.order_id) >= 2\n)\n"
  tables:
  - fact_orders
  filters:
  - fact_orders.paid_at IS NOT NULL
  examples:
  - 2025年两单及以上购买人数是多少
  - 今年多单客户有多少
  - 每月两单以上客户数
  - 各渠道多订单购买人数
  negative_examples:
  - 2025年复购人数是多少
  - 2025年复购率是多少
  - 购买人数是多少
  - FREQ是多少
- name: r12_base_customer_count
  chinese_name: R12 Base客户数
  aliases:
  - R12客户池
  - R12基础客户数
  - 过去12个月有效购买客户数
  - R12 Base人数
  grain: customer_cohort
  definition: 以当前报表开始日为边界，在其之前连续12个日历月内，至少发生一次有效购买的去重 customer 数。有效购买按成功支付金额扣除 completed refund 后的订单净有效消费大于0判断。该指标是 Periodic Customer Health 的 eligibility base，不是当前窗口购买人数，也不是会员人数。
  formula: COUNT(DISTINCT customer in R12 effective-purchase base)
  tables:
  - fact_orders
  - fact_order_items
  - fact_refunds
  filters:
  - base window = 12 calendar months immediately before report_start
  - fact_orders.paid_at IS NOT NULL
  - only completed refunds reduce effective purchase amount
  - refunds are attributed to original paid cohort
  - order effective amount must be > 0
  - full R12 history is required
  examples:
  - 2025年7月R12 Base客户数是多少
  - 7月报表的过去12个月客户池有多少人
  negative_examples:
  - 2025年7月购买人数是多少
  - 2025年7月跨日复购人数是多少
  - 会员人数是多少
- name: r12_repurchase_customer_count
  chinese_name: R12回购客户数
  aliases:
  - R12复购客户数
  - R12回购人数
  - Base回购人数
  - 老客回购人数
  grain: customer_cohort
  definition: R12 Base客户中，在当前报表窗口再次发生至少一次有效购买的去重 customer 数。同一个客户无论本期产生多少张有效订单，都只计一次。
  formula: COUNT(DISTINCT R12 Base customer with report-window effective purchase)
  tables:
  - fact_orders
  - fact_order_items
  - fact_refunds
  filters:
  - customer must belong to the report-specific R12 Base
  - report-window purchase must have order effective amount > 0
  - only completed refunds reduce effective purchase amount
  examples:
  - 2025年7月R12回购客户有多少
  - 7月Base客户中有多少人回来购买
  negative_examples:
  - 2025年7月跨日复购人数是多少
  - 2025年7月购买人数是多少
  - 新客数是多少
- name: r12_repurchase_rate
  chinese_name: R12回购率
  aliases:
  - R12复购率
  - Base回购率
  - R12客户回购率
  - 老客回购率
  grain: customer_cohort
  definition: R12回购客户数占对应报表期 R12 Base客户数的比例。Current 与 Reference 周期必须分别使用各自的 R12 Base，不能共用同一个 Base。该指标不等同于窗口内跨日复购率 repeat_customer_rate。
  formula: r12_repurchase_customer_count / NULLIF(r12_base_customer_count, 0)
  tables:
  - fact_orders
  - fact_order_items
  - fact_refunds
  filters:
  - full R12 history is required
  - effective purchase uses completed-refund-adjusted order amount > 0
  examples:
  - 2025年7月R12回购率是多少
  - 7月Base客户回购率相比6月如何
  negative_examples:
  - 2025年7月跨日复购率是多少
  - 首购后30天复购率是多少
  - 两单及以上客户占比是多少
- name: r12_repurchase_amount
  chinese_name: R12回购有效消费金额
  aliases:
  - R12回购金额
  - R12复购金额
  - Base客户本期有效消费
  - 老客回购金额
  grain: customer_cohort
  definition: 属于 R12 Base 且在当前报表窗口再次发生有效购买的客户，在该报表窗口形成的净有效消费金额。completed refund 按原始 paid cohort 回溯扣减。该指标不是 GMV，不能用支付发生即确认的 GMV 口径替代。
  formula: SUM(report-window effective amount of R12 repurchase customers)
  tables:
  - fact_orders
  - fact_order_items
  - fact_refunds
  filters:
  - customer must belong to the report-specific R12 Base
  - completed refunds reduce effective amount
  - order effective amount must be > 0
  examples:
  - 2025年7月R12回购有效消费金额是多少
  - 7月老客回购金额有多少
  negative_examples:
  - 2025年7月GMV是多少
  - 2025年7月会员GMV是多少
  - 退款金额是多少
- name: r12_repurchase_spending
  chinese_name: R12回购客人均有效消费
  aliases:
  - R12回购Spending
  - R12回购客人均消费
  - Base回购客人均消费
  - 老客回购人均消费
  grain: customer_cohort
  definition: R12回购有效消费金额除以 R12回购客户数，衡量本期发生回购的 Base 客户平均贡献的净有效消费。该指标不等同于全部 Buyer 的 Spending。
  formula: r12_repurchase_amount / NULLIF(r12_repurchase_customer_count, 0)
  tables:
  - fact_orders
  - fact_order_items
  - fact_refunds
  filters:
  - customer must belong to the report-specific R12 Base
  - only customers with report-window effective purchase enter denominator
  examples:
  - 2025年7月R12回购客人均有效消费是多少
  - 7月老客回购Spending是多少
  negative_examples:
  - 2025年7月Spending是多少
  - AUS是多少
  - 会员人均消费是多少
