metrics:

  - name: order_paid_amount
    chinese_name: 订单实付金额
    grain: order
    source_field: fact_orders.paid_amount
    definition: >
      已支付订单产生的实付销售金额
    formula: >
      SUM(paid_amount)
    tables:
      - fact_orders
    filters:
      - order_status = paid
    examples:
      - 订单金额最高
      - 客单价最高
      - 哪些订单支付金额最大
    negative_examples:
      - 退款最多
      - 退货最严重
      - 商品卖得最好

  - name: item_sales_amount
    chinese_name: 商品明细实付销售额
    aliases:
      - 销售额
      - 销售金额
      - 卖得最好
      - 卖得最火
      - 最能卖
      - 卖得好
    grain: order_item
    source_field: fact_order_items.item_paid_amount
    definition: >
      已支付订单产生的实付销售金额
    formula: >
      SUM(item_paid_amount)
    tables:
      - fact_orders
      - fact_order_items
    filters:
      - order_status = paid
    examples:
      - 哪个品类卖得最好
      - 哪个商品销售额最高
      - 销售冠军是谁
      - 哪个品类贡献收入最多
    negative_examples:
      - 退款最多
      - 退货最严重
      - 订单最多

  - name: refund_rate
    chinese_name: 退款率
    aliases:
      - 退款率
      - 退货率
      - 退货最严重
      - 退款最严重
      - 退得最厉害
    grain: order_item
    definition: >
      退款金额占销售金额比例
    formula: >
      SUM(refund_amount) / SUM(item_paid_amount)
    tables:
      - fact_orders
      - fact_order_items
      - fact_refunds
      - dim_product
    filters:
      - order_status = paid
    examples:
      - 哪个品类退款率最高
      - 退货最严重的是哪个品类
      - 哪个商品退款最多
      - 售后问题最严重的是谁
    negative_examples:
      - 卖得最好
      - 销售冠军
      - 订单最多

