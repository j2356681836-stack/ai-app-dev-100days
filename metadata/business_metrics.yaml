metrics:

  - name: order_paid_amount
    chinese_name: 订单实付金额
    aliases:
      - 订单金额
      - 订单实付金额
      - 实付金额
      - 支付金额
    grain: order
    source_field: fact_orders.paid_amount
    definition: >
      已支付订单产生的实付销售金额
    formula: >
      SUM(paid_amount)
    tables:
      - fact_orders
    filters:
      - order_status = paid
    examples:
      - 客单价最高
      - 哪些订单实付金额最大
      - 哪个订单支付金额最高
      - 订单金额最高的是哪笔
    negative_examples:
      - 退款最多
      - 退货最严重
      - 哪个品类销量最高
      - 哪个品类卖出最多件
      - 哪个品类订单最多
      - 哪个品类销售额最高
      - 哪个商品销售额最高
      - 哪个品类卖得最好

  - name: item_sales_amount
    chinese_name: 商品明细实付销售额
    aliases:
      - 商品销售额
      - 品类销售额
      - 卖得最好
      - 卖得最火
      - 最能卖
      - 卖得好
    grain: order_item
    source_field: fact_order_items.item_paid_amount
    definition: >
      已支付订单产生的实付销售金额
    formula: >
      SUM(item_paid_amount)
    tables:
      - fact_orders
      - fact_order_items
    filters:
      - order_status = paid
    examples:
      - 哪个品类卖得最好
      - 哪个商品销售额最高
      - 销售冠军是谁
      - 哪个品类贡献收入最多
      - 哪个品类销售额最高
      - 哪个品类销售金额最高
    negative_examples:
      - 退款最多
      - 退货最严重
      - 订单最多
      - 客单价最高
      - 哪些订单实付金额最大
      - 哪个品类销量最高
      - 哪个品类订单最多
    keyword_groups:
      - ["销售额", "品类"]
      - ["销售金额", "品类"]
      - ["销售额", "商品"]
      - ["销售金额", "商品"]

  - name: refund_rate
    chinese_name: 退款率
    aliases:
      - 退款率
      - 退货率
      - 退货最严重
      - 退款最严重
      - 退得最厉害
    grain: order_item
    definition: >
      退款金额占销售金额比例
    formula: >
      SUM(refund_amount) / SUM(item_paid_amount)
    tables:
      - fact_orders
      - fact_order_items
      - fact_refunds
      - dim_product
    filters:
      - order_status = paid
    examples:
      - 哪个品类退款率最高
      - 退货最严重的是哪个品类
      - 哪个商品退款最多
      - 售后问题最严重的是谁
    negative_examples:
      - 卖得最好
      - 销售冠军
      - 订单最多

  - name: order_count
    chinese_name: 订单数
    definition: 已支付订单的数量，用于衡量成交订单规模。
    formula: COUNT(DISTINCT fact_orders.order_id)
    aliases:
      - 订单数
      - 订单量
      - 订单最多
      - 订单量最高
      - 成交最多
      - 成交订单数
    examples:
      - 哪个品类订单最多
      - 哪个品类订单量最高
      - 哪个品类成交最多
    negative_examples:
      - 销售额最高
      - 销量最高
      - 退款率最高
    tables:
      - fact_orders
      - fact_order_items
      - dim_product
    filters:
      - fact_orders.order_status = 'paid'

  - name: sales_quantity
    chinese_name: 销量
    definition: 已支付订单中商品销售件数，用于衡量商品实际卖出的数量。
    formula: SUM(fact_order_items.quantity)
    aliases:
      - 销量
      - 销量最高
      - 卖出最多
      - 卖出最多件
      - 销售件数
      - 商品销量
    examples:
      - 哪个品类销量最高
      - 哪个商品卖出最多件
      - 哪个品类销售件数最多
    negative_examples:
      - 退款率最高
      - 哪个品类销售额最高
      - 哪个品类销售金额最高
      - 哪个品类订单最多
    tables:
      - fact_order_items
      - fact_orders
      - dim_product
    filters:
      - fact_orders.order_status = 'paid'

  - name: channel_sales_amount
    chinese_name: 渠道销售额
    aliases:
      - 渠道销售额
      - 渠道销售金额
      - 渠道收入
      - 渠道成交金额
      - 渠道GMV
      - 哪个渠道销售额最高
      - 哪个渠道收入最高
      - 哪个渠道卖得最好
    grain: channel
    source_field: fact_orders.paid_amount
    definition: >
      按销售渠道统计的已支付订单实付金额，
      用于衡量不同渠道带来的成交收入规模。
    formula: >
      SUM(fact_orders.paid_amount)
    tables:
      - fact_orders
      - dim_channel
    filters:
      - fact_orders.order_status = 'paid'
    examples:
      - 哪个渠道销售额最高
      - 哪个渠道收入最高
      - 哪个渠道成交金额最高
      - 哪个渠道卖得最好
      - 各渠道销售额排名
    negative_examples:
      - 哪个品类销售额最高
      - 哪个商品销售额最高
      - 哪个渠道退款率最高
      - 哪个渠道ROI最高
      - 哪个渠道获客成本最低
    keyword_groups:
      - ["渠道", "销售额"]
      - ["渠道", "销售金额"]
      - ["渠道", "收入"]
      - ["渠道", "成交金额"]
      - ["渠道", "卖得最好"]

  - name: channel_refund_rate
    chinese_name: 渠道退款率
    aliases:
      - 渠道退款率
      - 渠道退货率
      - 渠道售后率
      - 渠道退款最严重
      - 渠道退货最严重
      - 哪个渠道退款率最高
    grain: channel
    definition: >
      按销售渠道统计的退款金额占销售金额比例，
      用于衡量不同渠道的售后和退款风险。
    formula: >
      SUM(fact_refunds.refund_amount) / SUM(fact_order_items.item_paid_amount)
    tables:
      - fact_orders
      - fact_order_items
      - fact_refunds
      - dim_channel
    filters:
      - fact_orders.order_status = 'paid'
    examples:
      - 哪个渠道退款率最高
      - 哪个渠道退货率最高
      - 哪个渠道售后问题最严重
      - 各渠道退款率排名
    negative_examples:
      - 哪个品类退款率最高
      - 哪个商品退款率最高
      - 哪个渠道销售额最高
      - 哪个渠道ROI最高
      - 哪个渠道获客成本最低
    keyword_groups:
      - ["渠道", "退款率"]
      - ["渠道", "退货率"]
      - ["渠道", "售后"]
      - ["渠道", "退款最严重"]
      - ["渠道", "退货最严重"]

  - name: roi
    chinese_name: 投资回报率
    aliases:
      - ROI
      - roi
      - 投资回报率
      - 投放回报率
      - 营销回报率
      - 渠道ROI
      - 渠道roi
      - 渠道投资回报率
      - 渠道投放回报率
      - 哪个渠道ROI最高
      - 哪个渠道投放最划算
      - 哪个渠道营销回报最高
    grain: channel
    definition: >
      按渠道统计的销售额与营销投放成本之比，
      用于衡量不同渠道的投放效率。
      ROI 越高，表示单位营销成本带来的销售额越高。
      当同时使用订单表和营销投放表时，必须使用两张表的重叠日期窗口：
      start_date = GREATEST(MIN(fact_orders.order_date::date), MIN(fact_marketing_spend.spend_date))
      end_date = LEAST(MAX(fact_orders.order_date::date), MAX(fact_marketing_spend.spend_date))

    formula: >
      ROI = channel_sales_amount / marketing_spend_amount。
      channel_sales_amount 必须先从 fact_orders 按 channel_id 聚合；
      marketing_spend_amount 必须先从 fact_marketing_spend 按 channel_id 聚合；
      最后再按 channel_id JOIN 两个聚合结果。
    tables:
      - fact_orders
      - fact_marketing_spend
      - dim_channel
    filters:
      - fact_orders.order_status = 'paid'
    examples:
      - 哪个渠道ROI最高
      - 哪个渠道投放最划算
      - 哪个渠道营销回报最高
      - 各渠道ROI排名
    negative_examples:
      - 哪个渠道销售额最高
      - 哪个渠道退款率最高
      - 哪个渠道获客成本最低
      - 哪个品类销售额最高
    keyword_groups:
      - ["渠道", "ROI"]
      - ["渠道", "roi"]
      - ["渠道", "投资回报率"]
      - ["渠道", "投放回报率"]
      - ["渠道", "营销回报"]
      - ["渠道", "投放最划算"]

  - name: cac
    chinese_name: 获客成本
    aliases:
      - CAC
      - cac
      - 获客成本
      - 客户获取成本
      - 拉新成本
      - 渠道CAC
      - 渠道cac
      - 渠道获客成本
      - 渠道拉新成本
      - 哪个渠道CAC最低
      - 哪个渠道获客成本最低
      - 哪个渠道拉新成本最低
      - 哪个渠道拉新效率最高
    grain: channel
    definition: >
      按渠道统计的营销投放成本与获客客户数之比，
      用于衡量不同渠道获取一个新客户的平均成本。
      CAC 越低，表示渠道获客效率越高。
      本项目中获客客户数定义为真实首单新客：
      先在全量 paid 订单中找到每个客户的第一笔订单，
      再判断该首单是否落在分析时间窗口内，
      并将该首单所属渠道作为获客渠道。
    formula: >
      CAC = marketing_spend_amount / acquired_customer_count。
      marketing_spend_amount 必须先从 fact_marketing_spend 按 channel_id 聚合。
      acquired_customer_count 必须先在全量 paid 订单中使用
      ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY order_date ASC)
      找到每个客户的真实首单；
      然后再判断该真实首单的 order_date 是否落在分析时间窗口内；
      最后按真实首单的 channel_id 统计获客客户数。
      禁止先按时间窗口过滤订单后再计算 ROW_NUMBER()，避免把老客在窗口内的复购误判为新客。
    tables:
      - fact_marketing_spend
      - fact_orders
      - dim_channel
    filters:
      - fact_orders.order_status = 'paid'
    examples:
      - 哪个渠道CAC最低
      - 哪个渠道获客成本最低
      - 哪个渠道拉新成本最低
      - 哪个渠道拉新效率最高
      - 各渠道CAC排名
      - 各渠道获客成本排名
    negative_examples:
      - 哪个渠道ROI最高
      - 哪个渠道销售额最高
      - 哪个渠道退款率最高
      - 哪个品类销售额最高
    keyword_groups:
      - ["渠道", "CAC"]
      - ["渠道", "cac"]
      - ["渠道", "获客成本"]
      - ["渠道", "客户获取成本"]
      - ["渠道", "拉新成本"]
      - ["渠道", "拉新效率"]