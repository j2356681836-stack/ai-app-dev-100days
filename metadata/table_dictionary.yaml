tables:

  - name: fact_orders
    chinese_name: 订单事实表
    description: >
      记录订单层级信息，
      包括订单状态、订单金额、下单时间、付款时间等。
    primary_key:
      - order_id
    fields:
      order_id:
        description: 订单主键ID
      order_status:
        description: 订单状态
      paid_amount:
        description: 订单实付金额
      order_date:
        description: 下单时间
      customer_id:
        description: 用户ID
      channel_id: 
        description: 渠道ID
      gross_amount: 
        description: 订单原始金额
      discount_amount: 
        description: 订单优惠金额

  - name: fact_order_items
    chinese_name: 订单商品事实表
    description: >
      记录订单中的商品明细，
      是销售额分析的核心事实表。
    primary_key:
      - order_item_id
    foreign_keys:
      - order_id
      - product_id
    fields:
      order_item_id:
        description: 订单明细主键ID
      order_id:
        description: 订单ID
      product_id:
        description: 商品ID
      quantity:
        description: 商品数量
      unit_price:
        description: 商品单价
      item_gross_amount: 
        description: 商品原始金额
      item_discount_amount: 
        description: 商品优惠金额
      item_paid_amount: 
        description: 商品实付金额

  - name: fact_refunds
    chinese_name: 退款订单事实表
    description: >
      记录退款订单中的商品明细，
      包括订单退款状态、退款品类、退款金额，是退款分析的核心事实表。
    primary_key:
      - refund_id
    foreign_keys:
      - order_id
      - order_item_id
    fields:
      refund_id:
        description: 退款订单主键ID
      order_id:
        description: 原订单ID
      order_item_id:
        description: 原订单明细ID
      refund_date:
        description: 退款日期
      refund_amount:
        description: 退款金额
      refund_status: 
        description: 退款状态
      refund_reason: 
        description: 退款原因
      
  - name: dim_product
    chinese_name: 商品维度表
    description: >
      记录商品基础信息，
      包括商品名称、品牌、品类、子品类、价格、上架日期等。
    primary_key:
      - product_id
    fields:
      product_id:
        description: 商品ID
      product_name:
        description: 商品名称
      brand:
        description: 商品品牌
      category:
        description: 商品品类
      sub_category:
        description: 商品子品类
      price:
        description: 商品标价
      sku_code: 
        description: 商品库存单位编码
      launch_date: 
        description: 商品上市时间
      is_active: 
        description: 商品是否在售

  - name: dim_channel
    chinese_name: 渠道维度表
    description: >
      记录销售和营销投放渠道的基础信息，
      包括渠道名称和渠道类型。
      用于按渠道分析销售额、订单数、退款率、ROI 和 CAC 等指标。
    primary_key:
      - channel_id
    fields:
      channel_id:
        description: 渠道ID
      channel_name:
        description: 渠道名称，例如天猫、京东、抖音、小红书、微信小程序
      channel_type:
        description: 渠道类型，例如电商平台、内容电商、内容种草、私域

  - name: fact_marketing_spend
    chinese_name: 营销投放事实表
    description: >
      记录不同渠道在不同日期的营销投放花费，
      包括投放日期、投放活动名称和投放金额。
      是 ROI、CAC 和渠道投放效率分析的核心事实表。
    primary_key:
      - spend_id
    foreign_keys:
      - channel_id
    fields:
      spend_id:
        description: 营销投放记录主键ID
      channel_id:
        description: 渠道ID，关联 dim_channel.channel_id
      spend_date:
        description: 投放日期
      campaign_name:
        description: 营销活动名称
      spend_amount:
        description: 营销投放金额


  